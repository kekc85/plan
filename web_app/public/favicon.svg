<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Radar / Center of Gravity Circles -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Jet Vapor Trail -->
  <path d="M 10 54 Q 22 42, 34 30" fill="none" stroke="url(#trailGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Jet Aircraft Icon -->
  <g transform="translate(34, 28) rotate(-45) scale(1.15)" filter="url(#glow)">
    <path d="M 0 -18 C 1.2 -18 2.2 -14 2.2 -6 L 15 2 C 16 3 15.5 4.5 14 4.5 L 2.2 2.5 L 2.2 9 L 6 12 C 6.5 12.5 6 13.5 5 13.5 L 0 12 L -5 13.5 C -6 13.5 -6.5 12.5 -6 12 L -2.2 9 L -2.2 2.5 L -14 4.5 C -15.5 4.5 -16 3 -15 2 L -2.2 -6 C -2.2 -14 -1.2 -18 0 -18 Z" fill="url(#planeGrad)" />
    <ellipse cx="0" cy="-11" rx="1" ry="2.2" fill="#0284c7" />
  </g>

  <!-- Center of Gravity Point -->
  <circle cx="50" cy="14" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="50" cy="14" r="1.5" fill="#ffffff"/>
</svg>