<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="luggageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb700"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фон со скруглением под Cyber HUD Glass -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="#081226" stroke="#00f0ff" stroke-width="10" stroke-opacity="0.8"/>
  <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Радарная окружность -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.3"/>

  <!-- Чемодан (Baggage) -->
  <rect x="216" y="270" width="80" height="40" rx="14" fill="none" stroke="url(#luggageGrad)" stroke-width="10"/>
  <rect x="156" y="300" width="200" height="140" rx="24" fill="#0c1c38" stroke="url(#luggageGrad)" stroke-width="10"/>
  <line x1="176" y1="350" x2="336" y2="350" stroke="#ffb700" stroke-width="6" stroke-opacity="0.6"/>
  <line x1="176" y1="390" x2="336" y2="390" stroke="#ffb700" stroke-width="6" stroke-opacity="0.6"/>
  <circle cx="186" cy="444" r="12" fill="#00f0ff"/>
  <circle cx="326" cy="444" r="12" fill="#00f0ff"/>

  <!-- Самолет (Airplane) -->
  <g filter="url(#neonGlow)">
    <path d="M 256 70 
             L 280 130 
             L 416 220 
             L 416 250 
             L 286 245 
             L 284 310 
             L 336 340 
             L 331 360 
             L 256 335 
             L 181 360 
             L 176 340 
             L 228 310 
             L 226 245 
             L 96 250 
             L 96 220 
             L 232 130 Z" 
          fill="url(#planeGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Кабина пилотов -->
    <polygon points="256,95 268,135 256,145 244,135" fill="#081226"/>
    <!-- Осевая линия -->
    <line x1="256" y1="145" x2="256" y2="320" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>
  </g>
</svg>
